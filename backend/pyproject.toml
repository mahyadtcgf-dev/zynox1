[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zynox-backend"
version = "1.0.0"
description = "Zynox management panel backend"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.9.0",
    "psutil>=6.0.0",
    "qrcode>=7.4.2",
    "pyotp>=2.9.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
telegram = ["python-telegram-bot>=21.6"]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "ANN", "S"]
ignore = ["ANN101", "ANN102", "ANN401", "S101", "B008"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures and helpers read far worse with full annotations, and
# `token`/`password` variables there hold generated test data.
"tests/**" = ["ANN", "S105"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
